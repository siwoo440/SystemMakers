display_errors=Off ; 내부 오류 화면 노출 차단
display_startup_errors=Off ; 시작 오류 노출 차단
log_errors=On ; 서버 진단 기록
error_log=/proc/self/fd/2 ; 컨테이너 오류 출력
expose_php=Off ; PHP 버전 헤더 차단
date.timezone=UTC ; DB와 같은 시간대
upload_max_filesize=6M ; 최대 5 MiB 첨부 수용
post_max_size=7M ; 첨부와 요청 부가 정보 수용
memory_limit=128M ; 요청 메모리 상한
max_execution_time=30 ; HTTP 요청 실행 상한
session.save_handler=files ; 기존 파일 세션 유지
session.save_path=/var/lib/systemmakers/sessions ; 웹과 Ratchet 공유 저장소
session.serialize_handler=php ; 양쪽의 같은 세션 형식
session.gc_maxlifetime=43200 ; 기존 로그인 최대 수명
session.gc_probability=1 ; 웹 요청의 세션 정리 확률
session.gc_divisor=100 ; 세션 정리 주기 기준
session.use_strict_mode=1 ; 미발급 식별자 거절
session.use_only_cookies=1 ; 쿠키 전용 식별자 전달
