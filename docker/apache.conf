# 저장소 외부의 최소 공개 진입점
<VirtualHost *:80>
    # 공개 문서 루트
    DocumentRoot /srv/systemmakers/docker/public
    # 임의 호스트에 의존하지 않는 내부 이름
    ServerName systemmakers-web
    # 프록시가 덮어쓴 실제 접속 주소
    RemoteIPHeader X-Forwarded-For
    # Docker의 정확한 단일 프록시만 신뢰
    RemoteIPInternalProxy ${CADDY_PROXY_IP}
    # 민감한 요청 헤더와 쿼리를 기록하지 않는 로그
    LogFormat "%a %m %U %>s" systemmakers
    # 표준 출력 진단
    CustomLog /proc/self/fd/1 systemmakers
    # 표준 오류 진단
    ErrorLog /proc/self/fd/2
    # 저장소 전체의 기본 공개 금지
    <Directory /srv/systemmakers>
        # 직접 파일 접근 거절
        Require all denied
    </Directory>
    # 최소 진입점만 공개
    <Directory /srv/systemmakers/docker/public>
        # 목록과 링크 추적 차단
        Options -Indexes -FollowSymLinks
        # 개인 htaccess 해석 차단
        AllowOverride None
        # 공개 라우터 접근 허용
        Require all granted
        # 없는 경로도 허용 목록 라우터로 연결
        FallbackResource /index.php
        # 진입 파일 선택
        DirectoryIndex index.php
    </Directory>
</VirtualHost>
